<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home Screen - 125-171</title>
  <meta name="viewport" content="width=414, initial-scale=1.0">
  <link rel="stylesheet" href="./common.css">
  <link rel="stylesheet" href="./home-screen-125-171.css">
</head>
<body>
  <!-- Screen container (root frame) -->
  <div class="figma-screen home-screen-125-171" role="region" aria-label="Home Screen" style="width: 414px; height: 1100px;">
    <!-- Root background and rounded corners from style_0 -->
    <div class="home-screen-125-171__root-bg"></div>

    <!-- Rectangle 8 -->
    <div class="abs home-screen-125-171__rectangle-8" style="left: 24px; top: 143px; width: 365px; height: 157px;"></div>

    <!-- Book Review title -->
    <p class="abs home-screen-125-171__text book-review" style="left: 69px; top: 168px; width: 270px; height: 103px;">
      Book Review : The Design of Everyday Things by Don Norman
    </p>

    <!-- Spacer text (empty in design, preserved for fidelity) -->
    <p class="abs home-screen-125-171__text spacer" aria-hidden="true" style="left: 69px; top: 190px; width: 0px; height: 32px;"> </p>

    <!-- Rectangle 11 -->
    <div class="abs home-screen-125-171__rectangle-11" style="left: 24px; top: 323px; width: 365px; height: 123px;"></div>

    <!-- Animes produced by Ufotable -->
    <p class="abs home-screen-125-171__text animes" style="left: 69px; top: 352px; width: 254px; height: 64px;">
      Animes produced by Ufotable
    </p>

    <!-- Rectangle 10 -->
    <div class="abs home-screen-125-171__rectangle-10" style="left: 24px; top: 471px; width: 365px; height: 110px;"></div>

    <!-- Mangas planned to read -->
    <p class="abs home-screen-125-171__text mangas" style="left: 69px; top: 494px; width: 259px; height: 67px;">
      Mangas planned to read
    </p>

    <!-- Hero Text -->
    <h1 class="abs home-screen-125-171__hero" style="left: 24px; top: 47px; width: 115px; height: 59px;">
      Notes
    </h1>

    <!-- Button 1 (right icon button background) -->
    <button class="abs home-screen-125-171__btn btn-right" aria-label="Info" style="left: 339px; top: 51px; width: 50px; height: 50px;"></button>

    <!-- info_outline icon (component) -->
    <div class="abs home-screen-125-171__icon info-outline" style="left: 352px; top: 64px; width: 24px; height: 24px;">
      <!-- Vector layers simulated by background and inner vector -->
      <div class="home-screen-125-171__icon-layer" style="left: 0px; top: 0px; width: 24px; height: 24px;"></div>
      <div class="home-screen-125-171__icon-layer-fill" style="left: 2px; top: 2px; width: 20px; height: 20px;"></div>
    </div>

    <!-- Button 4 (left icon button background) -->
    <button class="abs home-screen-125-171__btn btn-left" aria-label="Search" style="left: 268px; top: 51px; width: 50px; height: 50px;"></button>

    <!-- search icon (component) -->
    <div class="abs home-screen-125-171__icon search" style="left: 281px; top: 64px; width: 24px; height: 24px;">
      <div class="home-screen-125-171__icon-layer" style="left: 0px; top: 0px; width: 24px; height: 24px;"></div>
      <div class="home-screen-125-171__icon-layer-fill" style="left: 2.999px; top: 2.999px; width: 17.048px; height: 17.058px;"></div>
    </div>

    <!-- Rectangle 13 -->
    <div class="abs home-screen-125-171__rectangle-13" style="left: 24px; top: 606px; width: 365px; height: 120px;"></div>

    <!-- Rectangle 9 -->
    <div class="abs home-screen-125-171__rectangle-9" style="left: 24px; top: 751px; width: 365px; height: 100px;"></div>

    <!-- Awesome tweets collection -->
    <p class="abs home-screen-125-171__text tweets" style="left: 69px; top: 632px; width: 287px; height: 68px;">
      Awesome tweets collection
    </p>

    <!-- List of free & open source apps -->
    <p class="abs home-screen-125-171__text foss-apps" style="left: 69px; top: 768px; width: 297px; height: 66px;">
      List of free &amp; open source apps
    </p>

    <!-- Ellipse 1 (FAB shadow base) -->
    <div class="abs home-screen-125-171__ellipse-1" style="left: 309px; top: 777px; width: 70px; height: 70px;"></div>

    <!-- add icon (component) -->
    <div class="abs home-screen-125-171__icon add" style="left: 320px; top: 788px; width: 48px; height: 48px;">
      <div class="home-screen-125-171__icon-layer" style="left: 0px; top: 0px; width: 48px; height: 48px;"></div>
      <div class="home-screen-125-171__icon-layer-fill" style="left: 10px; top: 10px; width: 28px; height: 28px;"></div>
    </div>
  </div>

  <script src="./app.js"></script>
  <script src="./home-screen-125-171.js"></script>
</body>
</html>
